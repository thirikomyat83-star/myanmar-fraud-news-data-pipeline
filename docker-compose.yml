version: '3.8'
services:
  localstack:
    image: localstack/localstack:3.7.2
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=ap-southeast-1

  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5444:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=news_warehouse
    volumes:
      - "./pg_data:/var/lib/postgresql/data"

  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      - S3_ENDPOINT=http://localstack:4566
      - BUCKET_NAME=myanmar-news-lake
      - DB_URL=postgresql://postgres:postgres@postgres:5432/news_warehouse
    depends_on:
      - localstack
      - postgres